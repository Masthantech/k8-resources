apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: nginx-dp 
  labels: 
    purpose: nginx-dp-demo 
spec: 
  replicas: 2 
  selector: 
    matchLabels: 
      purpose: nginx-db-demo 
      project: roboshop 
      environment: dev 
  template: 
    metadata: 
      name: nginx-dp 
      labels: 
        purpose: nginx-db-demo 
        project: roboshop 
        environment: dev 
    spec: 
      containers: 
      - name: nginx 
        image: nginx:1.24


               

#if we make any changes to pod image version and apply chanegs then, pod are recreated to
#match th echanges with the replicas.                