apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: nginx-dp 
  labels: 
    purpose: nginx-dp-demo 
spec: 
  replicas: 3 
  selector: 
    matchlabels: 
      purpose: nginx-dp-demo
      project: roboshop 
      environment: dev 

  template: 
    metadata: 
      name: nginx-dp
      labels: 
        purpose: nginx-dp-demo
        project: roboshop 
        environment: dev 
    spec: 
      containers: 
      - name: nginx
        image: nginx    

#if we make any changes to pod image version and apply chanegs then, pod are recreated to
#match th echanges with the replicas.                