
apiVersion: v1 
kind: Service 
metadata: 
  name: svc-demo 
  labels: 
    purpose: demo 
spec: 
  selector: 
    purpose: nginx-db-demo 
    project: roboshop 
    environment: dev 

  ports: 
    protocol: TCP 
    port: 80 
    targetPort: 80  

---
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: nginx-dp 
  labels: 
    purpose: nginx-dp-demo 
spec: 
  replicas: 2 
  selector: 
    matchLabels: 
      purpose: nginx-db-demo 
      project: roboshop 
      environment: dev 
  template: 
    metadata: 
      name: nginx-dp 
      labels: 
        purpose: nginx-db-demo 
        project: roboshop 
        environment: dev 
    spec: 
      containers: 
      - name: nginx 
        image: nginx:1.24
