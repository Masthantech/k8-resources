apiVersion: v1 
kind: PersistentVolumeClaim
metadata: 
  name: efs-dynamic 
spec: 
  accessModes: 
  - ReadWriteOnce 
  storageClassName: efs-roboshop
  resources: 
    requests: 
      storage: 4Gi  

--- 
apiVersion: v1 
kind: Pod 
metadata: 
  name: nginx
  labels: 
    purpose: efs-dynamic-demo 
    project: roboshop
spec: 
  nodeSelector: 
    topology.kubernetes.io/zone: us-east-1d 
  containers: 
  - name: nginx 
    image: nginx 
    volumeMounts: 
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes: 
  - name: persistent-storage
    persistentVolumeClaim: 
      claimName: efs-dynamic     
--- 
apiVersion: v1 
kind: Service 
metadata: 
  name: nginx-lb 
  labels: 
    purpose: efs-dynamic 
spec: 
  type: LoadBalancer 
  selector: 
    purpose: efs-dynamic-demo 
    project: roboshop
  ports: 
  - protocol: TCP 
    port: 80 
    targetPort: 80       

--- 
  