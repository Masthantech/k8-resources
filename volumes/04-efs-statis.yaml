apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0abdd6c9115fc381b 

--- 
apiVersion: v1 
kind: PersistentVolumeClaim 
metadata: 
  name: efs-static 

spec: 
  storageClassName: "" #empty sring must be explicitly set otherwise default storagecall will be set  
  volumeName: efs-static # name of the PV we created 
  accessModes: 
    - ReadWriteOnce 
  resources: 
    requests: 
      storage: 5Gi  

--- 
# pod definition 
apiVersion: v1 
kind: Pod 
metadata: 
  name: nginx 
  labels: 
    purpose: efs-static-demo 
    project: roboshop 
spec: 
  nodeSelector: 
    topology.kubernetes.io/zone: us-east-1d  
  containers: 
  - name: nginx 
    image: nginx 
    volumeMounts: 
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes: 
  - name: persistent-storage 
    volumeReclaimPolicy:
      volumeName: efs-static       

--- 
apiVersion: v1 
kind: Service 
metadata: 
  name: nginx-lb
  labels: 
    purpose: demo 
spec:
  type: LoadBalancer
  selector: 
    purpose: efs-static-demo
    project: roboshop
  ports: 
  - protocol: TCP 
    port: 80
    targetPort: 80
