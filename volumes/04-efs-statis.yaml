apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0abdd6c9115fc381b 

--- 
apiVersion: v1 
kind: PersistentVolumeClaim 
metadata: 
  name: efs-static 

spec: 
  storageClassName: "" #empty sring must be explicitly set otherwise default storagecall will be set  
  volumeNmae: efs-static # name of the PV we created 
  accessModes: 
    - ReadWriteOnce 
  resources: 
    requests: 
      storage: 5Gi  

