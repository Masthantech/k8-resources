apiVersion: v1 
kind: PersistentVolumeReclaim 
metadata: 
  name: ebs-dynamic 
spec: 
  accessModes: 
  - ReadWriteOnce 
  storageClassName: roboshop-ebs  
  resources: 
    requests: 
      storage: 4Gi

--- 
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels: 
    purpose: ebs-dynamic-demo
    environment: dev
spec:
  nodeSelector: 
    topology.kubernetes.io/zone: us-east-1b
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-dynamic

--- 
apiVersion: v1 
kind: Service 
metadata: 
  name: nginx-lb
  labels: 
    purpose: demo 
spec:
  type: LoadBalancer
  selector: 
    purpose: ebs-dynamic-demo
    environment: dev
  ports: 
  - protocol: TCP 
    port: 80
    targetPort: 80      