apiVersion: v1 
kind: PersistentVolumeClaim
metadata: 
  name: ebs-dynamic 
spec: 
  accessModes: 
  - ReadWriteOnce 
  storageClassName: roboshop-ebs-sc 
  resources: 
    requests: 
      storage: 4Gi  

--- 
apiVersion: v1 
kind: Pod 
metadata: 
  name: nginx-cs
  labels: 
    purpose: ebs-dynamic-demo 
    enviroment: dev 
spec: 
  nodeSelector: 
    topology.kubernetes.io/zone: us-east-1d 
  containers: 
  - name: nginx 
    image: nginx 
    volumeMounts: 
    - name: persistent-dynamic-storage 
      mountPath: /usr/share/nginx/html
  volumes: 
  - name: persistent-dynamic-storage 
    persistentVolumeClaim: 
      claimName: ebs-dynamic     
--- 
apiVersion: v1 
kind: Service 
metadata: 
  name: nginx-lb 
  labels: 
    purpose: ebs-dynamic 
spec: 
  type: LoadBalancer 
  selector: 
    purpose: ebs-dynamic-demo 
    enviroment: dev 
  ports: 
  - protocol: TCP 
    port: 80 
    targetPort: 80       

    