apiVersion: v1 
kind: Service 
metadata: 
  name: headless-svc 
  labels: 
    purpose: statefulset-demo 
    project: roboshop 
    environment: dev 
spec: 
  clusterIP: None 
  selector: 
    purpose: statefulset-demo 
    project: roboshop 
    environment: dev 
  ports: 
  - port: 80 
--- 

apiVersion: v1 
kind: Service 
metadata: 
  name: normal-svc 
  labels: 
    purpose: statefulset-demo 
    project: roboshop 
    environment: dev 
spec: 
  selector: 
    purpose: statefulset-demo 
    project: roboshop 
    environment: dev 
  ports: 
  - port: 80 

---
apiVersion: apps/v1 
kind: StatefulSet 
metadata: 
  name: statefulset-demo  
  labels: 
    purpose: statefulset-demo 
    project: roboshop 
    environment: dev 
spec: 
  replicas: 2
  selector: 
    matchLabels: 
      purpose: statefulset-demo 
      project: roboshop 
      environment: dev
  serviceName: headless-svc #headless service need to be given here 
  template: 
    metadata: 
      labels: 
        purpose: statefulset-demo 
        project: roboshop 
        environment: dev
    spec: 
    containers: 
    - name: nginx 
      image: nginx 
      volumeMounts: 
      - name: www 
        mountPath: /usr/share/nginx/html

  volumeClaimTemplates: 
  - metadata: 
      name: www 
    spec: 
      accessModes: ["ReadWriteOnce"]
      storageClassName: efs-roboshop
      resources: 
        requests: 
          storage: 1Gi       



